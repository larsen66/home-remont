<text class="note" x="1400" y="326" style="font-size:29px">КУХОННАЯ НИША</text>
<text class="note" x="1400" y="382" style="font-size:21px">Слева у входа, как в модели Blender.</text>
<text class="note" x="1400" y="420" style="font-size:22px">Вдоль стены: 218,3 см.</text>
<text class="note" x="1400" y="458" style="font-size:22px">Выступ внутрь кухни: 30,7 см.</text>
<text class="note" x="1400" y="496" style="font-size:22px">Высота под балкой: 267,5 см.</text>
<text class="note" x="1400" y="550" style="font-size:21px">Место вдоль стены - предварительное.</text>
<text class="note" x="1400" y="597" style="font-size:20px">3370 на чертеже: если мм, то 337 см.</text>
<text class="note" x="1400" y="630" style="font-size:20px">2675 вдоль плана - нужен ответ,</text>
<text class="note" x="1400" y="659" style="font-size:20px">длина ли это по полу.</text>
<text class="note" x="1400" y="755" style="font-size:29px">НИША СПАЛЬНИ</text>
<text class="note" x="1400" y="806" style="font-size:23px">Задняя стенка: 175,5 см.</text>
<text class="note" x="1400" y="846" style="font-size:23px">Глубина по эскизу: 93,5 см*.</text>
<text class="note" x="1400" y="886" style="font-size:23px">Проход из кухни: 121,5 см.</text>
<text class="note" x="1400" y="957" style="font-size:21px">* Разница длинных стен даёт 79,5 см.</text>
<text class="note" x="1400" y="990" style="font-size:21px">Положение задней стенки нужно уточнить.</text>
<text class="note" x="1400" y="1097" style="font-size:29px">ВАННАЯ</text>
<text class="note" x="1400" y="1144" style="font-size:23px">Вход через левую стену.</text>
<text class="note" x="1400" y="1184" style="font-size:23px">Справа внизу уступ: 23,5 и 77,5 см.</text>
<text class="note" x="1400" y="1224" style="font-size:23px">Высота: 306 см. Допуск: ±1 см.</text>
<line class="dimension" x1="1390" y1="1327" x2="1840" y2="1327"/>
<text class="note" x="1400" y="1384" style="font-size:22px">Сплошная линия - стена.</text>
<text class="note" x="1400" y="1423" style="font-size:22px">Разрыв - вход или балконная дверь.</text>
<text class="note" x="1400" y="1462" style="font-size:21px">Пунктир - край балки или примерная привязка.</text>
<text class="note" x="95" y="1644" style="font-size:22px">* Общая длина зала 770,5 см и глубина ниши спальни требуют проверки точек отсчёта.</text>
<text class="note" x="95" y="1680" style="font-size:22px">Размеры ванной: принят допуск ±1 см. Проёмы с ≈ вычислены по участкам стены.</text>
